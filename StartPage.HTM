<script>
let maxi = 63;
let baseURL = "https://onepsk.com/mossg/Images/RandomBackground/bg_";
if (navigator.userAgentData && navigator.userAgentData.brands) {
    const brands = navigator.userAgentData.brands;
    const isChrome = brands.some(b => b.brand.toLowerCase().includes("google chrome"));
    if (isChrome) {maxi = 65;baseURL = "https://cdn.aladhan.com/images/backgrounds/";}
}
let i = Math.floor(Math.random() * maxi) + 1;
function tick() {
    if (i > maxi) {i = 1;}
    const url = baseURL + i + ".jpg";
    const img = new Image();
    img.onload = function () {
        document.body.style.backgroundImage = `url('${url}')`;
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundPosition = "center";
        console.log("Successfully loaded BG:", i);
        i++;
    };
    img.onerror = function () {
        console.log(`Image ${i}.jpg is missing or failed. Finding a new start point...`);
        i = Math.floor(Math.random() * maxi) + 1;
        tick(); 
    };
    img.src = url;
}
tick();
setInterval(tick, 3000);
</script>

<script>
async function redirectByBrowser() {
    var browser = "default";
    var ua = navigator.userAgent.toLowerCase();

    // Modern Client Hints check to accurately detect pure Chromium vs Google Chrome vs Edge
    if (navigator.userAgentData && navigator.userAgentData.brands) {
        var brands = navigator.userAgentData.brands;
        var isEdge     = brands.some(b => b.brand.toLowerCase().includes("microsoft edge"));
        var isChromium = brands.some(b => b.brand.toLowerCase().includes("chromium"));
        var isChrome   = brands.some(b => b.brand.toLowerCase().includes("google chrome"));

        if (isEdge) {
            browser = "edge";
        } else if (isChrome) {
            browser = "chrome";
        } else if (isChromium) {
            browser = "chromium";
        }
    }

    // Fallback string-based matching if Client Hints are unavailable
    if (browser === "default") {
        if (ua.includes("firefox") || ua.includes("fxios")) {
            browser = "firefox";
        } else if (ua.includes("edg/")) {
            browser = "edge";
        } else if (ua.includes("chrome") || ua.includes("crios")) {
            browser = ua.includes("chromium") ? "chromium" : "chrome";
        }
    }

    var redirects = {
        chrome:   "file:///C:/Users/User/Documents/LibreWolf/distribution/htm/chrome.HTM",
        chromium: "file:///C:/Users/User/Documents/LibreWolf/distribution/htm/cr.HTM",
        firefox:  "file:///C:/Users/User/Documents/LibreWolf/distribution/htm/wolf.HTM",
        edge:     "file:///C:/Users/User/Documents/LibreWolf/distribution/htm/edgeoffice.HTM",
        default:  "https://www.starhub.com/mda-blocked/04.html"
    };

    window.location.href = redirects[browser] || redirects["default"];
}
</script>
